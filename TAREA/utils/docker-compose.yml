services:
  mysql:
    build: ./mysql/
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=datarea
      - MYSQL_DATABASE=olist_db
    ports:
      - '3312:3306'
    volumes: 
      - ./mysqldata:/mysql/data
    env_file: 
      - ./mysql/variables.env
volumes:
  mysqldata:
  mongodata: